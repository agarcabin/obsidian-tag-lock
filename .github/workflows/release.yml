name: Build, attest, and publish release assets

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the released source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build the plugin
        run: npm run build

      - name: Verify release version and assets
        shell: bash
        run: |
          test "$(node -p "require('./manifest.json').version")" = "${{ github.event.release.tag_name }}"
          test -f manifest.json
          test -f main.js
          test -f styles.css

      - name: Generate artifact attestations
        uses: actions/attest@v4
        with:
          subject-path: |
            manifest.json
            main.js
            styles.css

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" manifest.json main.js styles.css --repo "${{ github.repository }}" --clobber
